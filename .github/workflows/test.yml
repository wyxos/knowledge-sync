name: Test installers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify first run and idempotency
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          Set-Content .tmp/bootstrap.md "# Bootstrap`n`nPrivate routing."
          Set-Content .tmp/AGENTS.md "# Personal`n`nKeep this."
          ./install.ps1 -BootstrapFile .tmp/bootstrap.md -Target .tmp/AGENTS.md -NoAlias
          $first = Get-Content -Raw .tmp/AGENTS.md
          ./install.ps1 -BootstrapFile .tmp/bootstrap.md -Target .tmp/AGENTS.md -NoAlias
          $second = Get-Content -Raw .tmp/AGENTS.md
          if ($first -cne $second -or $second -notmatch '# Personal' -or $second -notmatch '# Bootstrap') { exit 1 }
          $env:KNOWLEDGE_SYNC_PROFILE = "$PWD/.tmp/profile.ps1"
          ./install.ps1 -BootstrapFile .tmp/bootstrap.md -Target .tmp/AGENTS.md
          if ((Get-Content -Raw $env:KNOWLEDGE_SYNC_PROFILE) -notmatch 'function global:knowledge-sync') { exit 1 }

          # The documented `irm <url> | iex` form has no script command context,
          # so `$PSCmdlet` is null. Exercise that invocation mode offline.
          $inline = Get-Content -Raw ./install.ps1
          $inline = $inline.Replace('[string] $Target,', "[string] `$Target = '$PWD/.tmp/inline-AGENTS.md',")
          $inline = $inline.Replace('[string] $BootstrapFile,', "[string] `$BootstrapFile = '$PWD/.tmp/bootstrap.md',")
          $inline = $inline.Replace('[switch] $NoAlias', '[switch] $NoAlias = $true')
          $inline | Invoke-Expression
          if ((Get-Content -Raw .tmp/inline-AGENTS.md) -notmatch '# Bootstrap') { exit 1 }

  bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify syntax, first run, and idempotency
        shell: bash
        run: |
          bash -n install.sh
          mkdir -p .tmp
          printf '# Bootstrap\n\nPrivate routing.\n' > .tmp/bootstrap.md
          printf '# Personal\n\nKeep this.\n' > .tmp/AGENTS.md
          ./install.sh --bootstrap-file .tmp/bootstrap.md --target .tmp/AGENTS.md --no-alias
          cp .tmp/AGENTS.md .tmp/first.md
          ./install.sh --bootstrap-file .tmp/bootstrap.md --target .tmp/AGENTS.md --no-alias
          cmp .tmp/first.md .tmp/AGENTS.md
          grep -q '# Personal' .tmp/AGENTS.md
          grep -q '# Bootstrap' .tmp/AGENTS.md
          KNOWLEDGE_SYNC_RC="$PWD/.tmp/shellrc" ./install.sh --bootstrap-file .tmp/bootstrap.md --target .tmp/AGENTS.md
          grep -q 'knowledge-sync()' .tmp/shellrc
